services:
  mysql:
    image: mysql:8.0
    container_name: project3_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: project_3
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - project3_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: project3_backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      - DOTNET_USE_POLLING_FILE_WATCHER=true
      - ConnectionStrings__DefaultConnection=Server=mysql;Port=3306;Database=project_3;User ID=appuser;Password=apppassword;CharSet=utf8mb4;SslMode=None;AllowPublicKeyRetrieval=True;
      - Jwt__Key=YourSuperSecretKeyForJWTTokenGenerationThatShouldBeAtLeast32CharactersLong!
      - Jwt__Issuer=http://localhost:5000
      - Jwt__Audience=http://localhost:3000
      - Jwt__AccessTokenExpirationMinutes=15
      - Jwt__RefreshTokenExpirationDays=7
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/src
      - /src/bin
      - /src/obj
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - project3_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: project3_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://backend:5000
      - DOCKER_ENV=true
    depends_on:
      - backend
    networks:
      - project3_network

volumes:
  mysql_data:
    driver: local

networks:
  project3_network:
    driver: bridge

